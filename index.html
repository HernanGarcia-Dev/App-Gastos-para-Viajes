<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Gastos de Viaje</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--tx:#e8eaee;--mu:#8b92a1;--ac:#5b9dff;--ok:#3ecf8e;--bad:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--line:#e2e5ea;--tx:#15171c;--mu:#6a7282;--ac:#2563eb;--ok:#0f9d58;--bad:#d93025}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:12px 16px;max-width:640px;margin:auto}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:var(--bad)}
.ic{background:none;border:none;font-size:20px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px #0006}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(92vw,440px);padding:16px}
dialog::backdrop{background:#0009}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:20px;padding:6px 12px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:4px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
details.cat summary{list-style:none;cursor:pointer}details.cat summary::-webkit-details-marker{display:none}
.empty{text-align:center;color:var(--mu);padding:40px 0}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const KEY='gastos-viaje-v1';
// Categorías típicas de viaje. Las personalizadas ("Otra") salen de los gastos cargados, así se comparten solas entre celulares.
const CATS=[['Alojamiento','🏨'],['Transporte','🚗'],['Comida','🍔'],['Entradas y actividades','🎢'],['Compras','🛍️']];
const CAT_KW=[['Alojamiento',/hotel|hostel|airbnb|aloja|motel|resort|booking/],
 ['Transporte',/auto|uber|taxi|cole|colectivo|bus|tren|brightline|nafta|gasolina|peaje|toll|estacion|parking|vuelo|avion|aero|metro|subte|lyft|remis/],
 ['Comida',/comida|cena|almuerzo|desayuno|merienda|restau|subway|mcdonald|burger|cafe|starbucks|super|snack|bebida|pizza|helado/],
 ['Compras',/compra|shopping|regalo|ropa|outlet|souvenir|walmart|target|mall/],
 ['Entradas y actividades',/entrada|ticket|disney|universal|parque|tour|ksc|museo|excursion|show|seaworld|actividad/]];
const norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const guessCat=d=>CAT_KW.find(([,r])=>r.test(norm(d)))?.[0]||'';
const catIcon=c=>CATS.find(x=>x[0]===c)?.[1]||(c?'📦':'❔');
const tripCats=t=>[...CATS.map(c=>c[0]),...[...new Set(t.expenses.map(e=>e.cat).filter(c=>c&&!CATS.some(x=>x[0]===c)))].sort()];
let S=load(), view=null, tab='gastos';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{trips:[]}}catch{return{trips:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{alert('No se pudo guardar en el dispositivo')}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const trip=()=>S.trips.find(t=>t.id===view);

// ---- dinero (centavos enteros) ----
function parseAmt(s){
  s=String(s).replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){const dec=lc>ld?',':'.';const th=dec===','?'.':',';s=s.split(th).join('').replace(dec,'.')}
  else if(lc>-1){s=s.replace(',','.')}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.split('.').join('')}
  const n=parseFloat(s);return isFinite(n)&&n>0?Math.round(n*100):NaN;
}
const fmt=(c,t)=>(c<0?'-':'')+(t?.cur||'$')+(Math.abs(c)/100).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function shares(e){
  if(e.split)return Object.entries(e.split).filter(([,v])=>v>0).map(([p,v])=>({p,v}));
  const n=e.parts.length,base=Math.floor(e.amt/n);let rem=e.amt-base*n;
  const order=[...e.parts.filter(p=>p!==e.payer),...e.parts.filter(p=>p===e.payer)],extra=new Set();
  order.forEach(p=>{if(rem>0){extra.add(p);rem--}});
  return e.parts.map(p=>({p,v:base+(extra.has(p)?1:0)}));
}
// Texto "Lu debe $X" para un gasto (lo que el resto le debe a quien pagó)
function debtText(t,e){
  const sh=shares(e),owed=e.amt-(sh.find(s=>s.p===e.payer)?.v||0);
  if(owed<=0)return 'sin deuda';
  const others=sh.filter(s=>s.p!==e.payer&&s.v>0);
  return others.length===1?`${name(t,others[0].p)} debe ${fmt(owed,t)}`:`le deben ${fmt(owed,t)}`;
}
const c2s=c=>(c/100).toFixed(2).replace('.',',');
function balances(t){
  const b={};t.people.forEach(p=>b[p.id]=0);
  t.expenses.forEach(e=>{if(b[e.payer]!==undefined)b[e.payer]+=e.amt;shares(e).forEach(s=>{if(b[s.p]!==undefined)b[s.p]-=s.v})});
  return b;
}
function settle(t){
  const b=balances(t),cr=[],db=[];
  Object.entries(b).forEach(([id,v])=>{if(v>0)cr.push([id,v]);else if(v<0)db.push([id,-v])});
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const out=[];let i=0,j=0;
  while(i<cr.length&&j<db.length){
    const m=Math.min(cr[i][1],db[j][1]);
    out.push({from:db[j][0],to:cr[i][0],v:m});
    cr[i][1]-=m;db[j][1]-=m;if(!cr[i][1])i++;if(!db[j][1])j++;
  }
  return out;
}
const name=(t,id)=>t.people.find(p=>p.id===id)?.name||'?';

// ---- sincronización (Firebase Firestore) ----
let sync=null;const subs={},pend={},live={},serr={};
const ALPHA='abcdefghijkmnpqrstuvwxyz23456789';
const showCode=c=>c.match(/.{1,5}/g).join('-');
const cleanCode=x=>{x=String(x).trim();const m=x.match(/#join=([\w-]+)/);return(m?m[1]:x).toLowerCase().replace(/[^a-z0-9]/g,'')};
async function initSync(){
  try{
    const cfg=(await import('./firebase-config.js')).default;
    if(cfg&&cfg.projectId){
      const B='https://www.gstatic.com/firebasejs/10.12.2/';
      const [{initializeApp},fs,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
      const app=initializeApp(cfg);let db;
      // Long polling: funciona aunque la red móvil retenga las conexiones en vivo.
      try{db=fs.initializeFirestore(app,{experimentalForceLongPolling:true,localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}
      catch{db=fs.getFirestore(app)}
      // Identidad anónima del celular: queda guardada en el dispositivo y es la que se registra como una persona del viaje.
      const auth=au.getAuth(app);
      sync={db,fs,au,auth,uid:null,authErr:null};
      await auth.authStateReady();
      sync.uid=auth.currentUser?.uid||null;
      if(!sync.uid)await signIn();
      S.trips.filter(t=>t.code).forEach(subscribe);
    }
  }catch(err){console.warn('Sincronización no disponible',err)}
  render();
  const m=location.hash.match(/^#join=([\w-]+)/);
  if(m&&sync){history.replaceState(null,'',location.pathname+location.search);joinDialog(m[1])}
}
async function signIn(){
  try{const r=await sync.au.signInAnonymously(sync.auth);sync.uid=r.user.uid;sync.authErr=null}
  catch(e){console.warn('Sin identidad',e);sync.authErr=e.code||'error'}
}
const srvClaims={},claiming={};
// Persona registrada por ESTE celular (según la nube), o undefined.
const mine=t=>sync?.uid&&t.claims?Object.keys(t.claims).find(p=>t.claims[p]===sync.uid):undefined;
const freePeople=t=>t.people.filter(p=>!t.claims?.[p.id]);
function subscribe(t){
  if(!sync||subs[t.code]||!S.trips.includes(t))return;
  const {db,fs}=sync,c=t.code;let u1=()=>{},u2=null,u3=()=>{},timer=null;
  const stopExp=()=>{if(u2){u2();u2=null}};
  const stop=()=>{u1();u3();stopExp();clearTimeout(timer)};
  // Si la escucha en vivo se corta con error, se reintenta sola.
  const onErr=err=>{console.warn('Escucha cortada',err);serr[c]=err.code||'error';live[c]=false;stop();delete subs[c];render();timer=setTimeout(()=>subscribe(t),5000)};
  const startExp=()=>{if(u2)return;u2=fs.onSnapshot(fs.collection(db,'trips',c,'expenses'),{includeMetadataChanges:true},snap=>{
    const all=snap.docs.map(x=>{const d=x.data({serverTimestamps:'estimate'});return {...d,id:x.id,at:d.at?.toMillis?.()??null}});
    const ok=all.filter(e=>validExp(t,e));
    t.expenses=ok.filter(e=>!e.del).sort((a,b)=>a.date-b.date);
    t.trash=ok.filter(e=>e.del).sort((a,b)=>(b.at||0)-(a.at||0));
    t.bad=all.length-ok.length;
    if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites)backfill(t);
    pend[c]=snap.metadata.hasPendingWrites;live[c]=!snap.metadata.fromCache;delete serr[c];save();render();
  },onErr)};
  u1=fs.onSnapshot(fs.doc(db,'trips',c),snap=>{
    if(!snap.exists())return;const d=snap.data();
    t.name=d.name;t.cur=d.cur;t.people=d.people;save();render();
  },onErr);
  u3=fs.onSnapshot(fs.collection(db,'trips',c,'claims'),{includeMetadataChanges:true},snap=>{
    const cl={};snap.docs.forEach(x=>cl[x.id]=x.data().uid);t.claims=cl;
    if(!snap.metadata.fromCache)srvClaims[c]=true;
    const m=mine(t);
    if(m){S.me={...S.me,[t.id]:m};if(!snap.metadata.hasPendingWrites)startExp()}
    else{
      stopExp();
      const want=S.me?.[t.id];
      if(srvClaims[c]&&want&&!cl[want]&&sync.uid&&!claiming[c])claim(t,want);   // ya lo había elegido antes: se registra solo
      else if(srvClaims[c]&&want&&cl[want]&&!claiming[c]){S.me={...S.me};delete S.me[t.id]}
    }
    save();render();
  },onErr);
  subs[c]=stop;
}
function claim(t,pid){
  const {db,fs}=sync,c=t.code;
  if(!sync.uid)return alert('No se pudo identificar este celular. Revisá la conexión e intentá de nuevo.');
  claiming[c]=true;S.me={...S.me,[t.id]:pid};save();
  const b=fs.writeBatch(db);
  b.set(fs.doc(db,'trips',c,'claims',pid),{uid:sync.uid,at:fs.serverTimestamp()});
  b.set(fs.doc(db,'trips',c,'members',sync.uid),{pid,at:fs.serverTimestamp()});
  b.commit().then(()=>{claiming[c]=false}).catch(e=>{
    console.warn(e);claiming[c]=false;S.me={...S.me};delete S.me[t.id];save();render();
    alert(`No se pudo registrar este celular como ${name(t,pid)}. Probablemente otro celular ya lo hizo.`);
  });
}
// Al volver a la app o recuperar internet, reconecta en el acto (el celular congela la conexión en segundo plano).
let kickAt=0;
function kick(){
  if(!sync||document.hidden||Date.now()-kickAt<3000)return;kickAt=Date.now();
  const {db,fs}=sync;
  fs.disableNetwork(db).then(()=>fs.enableNetwork(db)).catch(e=>console.warn(e));
  if(!sync.uid)signIn().then(()=>S.trips.filter(t=>t.code).forEach(t=>{subs[t.code]?.();delete subs[t.code];subscribe(t)}));
  S.trips.filter(t=>t.code&&!subs[t.code]).forEach(subscribe);
}
let failAt=0;
const fail=e=>{console.error('Error de sincronización',e);if(Date.now()-failAt>5000){failAt=Date.now();alert('No se pudo guardar en la nube ('+(e.code||e.message)+').')}};
function remoteSave(t,e,act='save',c=t.code){
  const {db,fs}=sync;
  const o={amt:e.amt,desc:e.desc,payer:e.payer,parts:e.parts,date:e.date};
  if(e.split)o.split=e.split;if(e.cat)o.cat=e.cat;if(e.del)o.del=true;
  const by=S.me?.[t.id]||'',hr=fs.doc(fs.collection(db,'trips',c,'history')),b=fs.writeBatch(db);
  b.set(hr,{exp:e.id,act,data:o,by,at:fs.serverTimestamp()});
  b.set(fs.doc(db,'trips',c,'expenses',e.id),{...o,by,at:fs.serverTimestamp(),h:hr.id});
  b.commit().catch(fail);
}
// Gastos cargados antes del historial: se respaldan una vez (queda una versión restaurable de cada uno).
const backed={};
function backfill(t){
  if(backed[t.code]||!mine(t))return;backed[t.code]=true;
  [...t.expenses,...(t.trash||[])].filter(e=>!e.h).forEach(e=>remoteSave(t,e,'backup'));
}
// Descarta gastos con datos inválidos en vez de romper los cálculos.
function validExp(t,e){
  const ids=new Set(t.people.map(p=>p.id)),isI=x=>Number.isInteger(x);
  if(!isI(e.amt)||e.amt<=0||e.amt>1e8||typeof e.desc!=='string'||!ids.has(e.payer))return false;
  if(!Array.isArray(e.parts)||!e.parts.length||!e.parts.every(p=>ids.has(p)))return false;
  if(e.split!=null){
    if(typeof e.split!=='object')return false;
    const v=Object.entries(e.split);
    if(!v.length||!v.every(([k,x])=>ids.has(k)&&isI(x)&&x>=0)||v.reduce((s,[,x])=>s+x,0)!==e.amt)return false;
  }
  if(e.cat!=null&&typeof e.cat!=='string')return false;
  if(typeof e.date!=='number')e.date=0;
  return true;
}
const whoName=(t,x)=>t.people.find(p=>p.id===x)?.name||x||'?';
async function joinTrip(raw){
  const c=cleanCode(raw);
  if(c.length<16)return alert('Código inválido');
  const ex=S.trips.find(t=>t.code===c);
  if(ex){view=ex.id;tab='gastos';close();render();return}
  try{
    const snap=await sync.fs.getDoc(sync.fs.doc(sync.db,'trips',c));
    if(!snap.exists())return alert('No existe un viaje con ese código');
    const d=snap.data();
    const t={id:uid(),code:c,name:d.name,cur:d.cur,people:d.people,expenses:[]};
    S.trips.push(t);save();subscribe(t);view=t.id;tab='gastos';close();render();
  }catch(err){console.warn(err);alert('No se pudo unir. Revisá el código y que tengas internet.')}
}

// ---- render ----
function render(){
  const t=view&&trip();if(view&&!t)view=null;
  if(!t){
    $('#hd').innerHTML='<h1>✈️ Mis viajes</h1>'+(sync?'<button id="jn">Unirme</button>':'');
    $('#jn')&&($('#jn').onclick=()=>joinDialog());
    $('#app').innerHTML=(S.trips.length?S.trips.map(x=>`<div class="card row" data-t="${x.id}" style="cursor:pointer"><div><div class="b">${x.code?'☁️ ':''}${esc(x.name)}</div><div class="mu">${x.people.map(p=>esc(p.name)).join(', ')} · ${x.expenses.length} gastos</div></div><div class="b">${fmt(x.expenses.reduce((a,e)=>a+e.amt,0),x)}</div></div>`).join(''):'<div class="empty">Abrí el link del viaje que te compartieron,<br>o tocá <b>Unirme</b> y pegá el código.</div>');
    document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{view=el.dataset.t;tab='gastos';render()});
    return;
  }
  if(S.last!==t.id){S.last=t.id;save()}
  const myP=mine(t),locked=t.code&&sync&&srvClaims[t.code]&&!myP&&!claiming[t.code];
  if(locked&&freePeople(t).length&&!$('#dlg').open)setTimeout(()=>meDialog(t),0);
  $('#hd').innerHTML=`<button class="ic" id="bk">←</button><h1>${esc(t.name)}</h1><button class="ic" id="mn">⋯</button>`;
  $('#bk').onclick=()=>{view=null;render()};$('#mn').onclick=menuDialog;
  const tot=t.expenses.reduce((a,e)=>a+e.amt,0);
  const st0=settle(t);
  let h=`<div class="card"><div class="row"><span class="mu">Total gastado</span><span class="b">${fmt(tot,t)}</span></div>
  ${st0.length?st0.map(s=>`<div class="row" style="margin-top:6px;font-size:17px"><span>${esc(name(t,s.from))} le debe a ${esc(name(t,s.to))}</span><span class="b bad">${fmt(s.v,t)}</span></div>`).join(''):'<div style="margin-top:6px">Están a mano ✔</div>'}</div>
  ${t.code&&!(locked&&!freePeople(t).length)?`<div class="mu" style="text-align:center">☁️ ${!sync?'Sincronización no disponible':!sync.uid?'No se pudo identificar este celular ('+esc(sync.authErr||'sin conexión')+')':!navigator.onLine?'Sin conexión · se sincroniza al volver':serr[t.code]?'Error de conexión ('+esc(serr[t.code])+') · reintentando…':pend[t.code]?'Pendiente de sincronizar…':live[t.code]?'Sincronizado en vivo':'Conectando…'}</div>`:''}
  ${locked&&!freePeople(t).length?'<div class="card bad">🔒 Todas las personas de este viaje ya están registradas en otros celulares. Este celular no tiene acceso.</div>':''}
  ${t.bad?`<div class="card bad" style="font-size:13px">⚠️ Se ignoraron ${t.bad} gasto${t.bad>1?'s':''} con datos inválidos.</div>`:''}
  <div class="tabs"><button data-tab="gastos" class="${tab==='gastos'?'on':''}">Gastos</button><button data-tab="saldos" class="${tab==='saldos'?'on':''}">Saldos</button><button data-tab="resumen" class="${tab==='resumen'?'on':''}">Resumen</button></div>`;
  if(tab==='gastos'){
    h+=t.expenses.length?[...t.expenses].reverse().map(e=>{
      return `<div class="card row" data-e="${e.id}" style="cursor:pointer"><div><div class="b">${e.cat?catIcon(e.cat)+' ':''}${esc(e.desc)}</div><div class="mu">Pagó ${esc(name(t,e.payer))} · ${esc(debtText(t,e))}</div></div><div class="b">${fmt(e.amt,t)}</div></div>`}).join(''):'<div class="empty">Sin gastos todavía.</div>';
    if(!locked)h+='<button class="p fab" id="ne">+ Gasto</button>';
  }else if(tab==='resumen'){h+=resumen(t)}else{
    const b=balances(t),st=settle(t);
    h+='<div class="card"><div class="mu" style="margin-bottom:6px">Balance por persona</div>'+t.people.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="b ${b[p.id]>0?'ok':b[p.id]<0?'bad':''}">${b[p.id]>0?'le deben ':b[p.id]<0?'debe ':''}${fmt(Math.abs(b[p.id]),t)}</span></div>`).join('')+'</div>';
    h+='<div class="card"><div class="mu" style="margin-bottom:6px">Para saldar</div>'+(st.length?st.map(s=>`<div class="row"><span>${esc(name(t,s.from))} → ${esc(name(t,s.to))}</span><span class="b">${fmt(s.v,t)}</span></div>`).join(''):'<div>Están a mano ✔</div>')+'</div>';
    h+='<button class="p" id="sh" style="width:100%">Compartir resumen</button>';
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  if(!locked)document.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>expDialog(el.dataset.e));
  $('#ne')&&($('#ne').onclick=()=>expDialog());
  $('#sh')&&($('#sh').onclick=shareSummary);
  $('#ac')&&($('#ac').onclick=()=>{
    if(t.code&&!mine(t))return alert('Este celular todavía no está registrado como una persona del viaje.');
    t.expenses.forEach(e=>{if(!e.cat){const c=guessCat(e.desc);if(c){e.cat=c;t.code&&remoteSave(t,e)}}});save();render();
  });
}
function resumen(t){
  const tot=t.expenses.reduce((a,e)=>a+e.amt,0);
  if(!tot)return '<div class="empty">Sin gastos todavía.</div>';
  const g={};t.expenses.forEach(e=>{const c=e.cat||'';(g[c]=g[c]||[]).push(e)});
  const rows=Object.entries(g).map(([c,es])=>({c,es,v:es.reduce((a,e)=>a+e.amt,0)})).sort((a,b)=>b.v-a.v),max=rows[0].v;
  let h='<div class="card"><div class="mu" style="margin-bottom:8px">Gastos por categoría · tocá una para ver el detalle</div>'+rows.map(r=>`<details class="cat"><summary>
    <div class="row"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${catIcon(r.c)} ${esc(r.c||'Sin categoría')} <span class="mu">· ${r.es.length}</span></span><span style="white-space:nowrap"><span class="b">${fmt(r.v,t)}</span> <span class="mu">${r.v*100/tot<1?'<1':Math.round(r.v*100/tot)}%</span></span></div>
    <div class="bar"><i style="width:${(r.v/max*100).toFixed(1)}%"></i></div></summary>
    ${[...r.es].sort((a,b)=>b.amt-a.amt).map(e=>`<div class="row mu" style="padding:2px 0 2px 26px"><span>${esc(e.desc)}</span><span>${fmt(e.amt,t)}</span></div>`).join('')}<div style="height:8px"></div></details>`).join('')+'</div>';
  const unc=t.expenses.filter(e=>!e.cat&&guessCat(e.desc)).length;
  if(unc)h+=`<button id="ac" style="width:100%">✨ Categorizar automáticamente ${unc} gasto${unc>1?'s':''}</button>`;
  const paid={},cons={};t.people.forEach(p=>{paid[p.id]=0;cons[p.id]=0});
  t.expenses.forEach(e=>{if(paid[e.payer]!==undefined)paid[e.payer]+=e.amt;shares(e).forEach(x=>{if(cons[x.p]!==undefined)cons[x.p]+=x.v})});
  h+='<div class="card"><div class="row mu" style="margin-bottom:6px"><span>Por persona</span><span>Pagó · Le corresponde</span></div>'+t.people.map(p=>`<div class="row"><span>${esc(p.name)}</span><span><span class="b">${fmt(paid[p.id],t)}</span> · ${fmt(cons[p.id],t)}</span></div>`).join('')+'</div>';
  return h;
}

// ---- diálogos ----
function open(html){const d=$('#dlg');if(d.open)d.close();d.innerHTML=html;d.showModal();return d}
function close(){$('#dlg').close()}

function expDialog(id){
  const t=trip(),e=id?t.expenses.find(x=>x.id===id):null;
  if(t.code&&!mine(t))return sync&&srvClaims[t.code]&&freePeople(t).length?meDialog(t):alert('Este celular todavía no está registrado como una persona del viaje. Necesitás conexión a internet.');
  const lp=S.lastPayer?.[t.id];
  const me=S.me?.[t.id],ok1=x=>t.people.some(p=>p.id===x);
  let payer=e?e.payer:ok1(me)?me:ok1(lp)?lp:t.people[0].id;
  let parts=new Set(e?e.parts:t.people.map(p=>p.id));
  let custom=!!e?.split;
  let cat=e?.cat||'',catTouched=!!e?.cat,otra=false;
  const cv={};if(e?.split)t.people.forEach(p=>cv[p.id]=e.split[p.id]?c2s(e.split[p.id]):'');
  const d=open(`<h3 style="margin:0">${e?'Editar gasto':'Nuevo gasto'}</h3>
  <label>Monto</label><input id="a" inputmode="decimal" placeholder="0,00" value="${e?c2s(e.amt):''}">
  <label>Concepto</label><input id="d" value="${e?esc(e.desc):''}">
  <label>Categoría</label><div class="chips" id="ct"></div>
  <input id="co" maxlength="40" placeholder="Nombre de la nueva categoría" style="display:none;margin-top:6px">
  <label>Pagó</label><div class="chips" id="pw"></div>
  <div class="row" style="margin-top:12px"><span class="mu">Reparto</span><button class="chip" id="md"></button></div>
  <div id="ch" style="margin-top:8px"></div>
  <div class="mu" id="pv" style="margin-top:8px"></div>
  ${e&&e.by?`<div class="mu" style="margin-top:10px">Última edición: ${esc(whoName(t,e.by))}${e.at?' · '+new Date(e.at).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''}</div>`:''}
  <div class="acts">${e?'<button class="d" id="del">Borrar</button>':''}${e&&t.code?'<button id="hi">Historial</button>':''}<button id="x">Cancelar</button><button class="p" id="ok">Guardar</button></div>`);
  d.querySelector('#hi')&&(d.querySelector('#hi').onclick=()=>historyDialog(t,e));
  const amtNow=()=>parseAmt(d.querySelector('#a').value);
  const customVals=()=>{const r={};for(const p of t.people){const raw=(cv[p.id]||'').trim();if(!raw){r[p.id]=0;continue}const v=parseAmt(raw);if(isNaN(v))return null;r[p.id]=v}return r};
  const preview=()=>{
    const a=amtNow(),pv=d.querySelector('#pv');
    if(isNaN(a)){pv.textContent='';return}
    if(custom){
      const r=customVals();if(!r){pv.textContent='Hay un monto inválido';return}
      const sum=Object.values(r).reduce((x,y)=>x+y,0),dif=a-sum;
      pv.textContent=dif===0?'✔ '+debtText(t,{amt:a,payer,split:r}):(dif>0?'Faltan ':'Sobran ')+fmt(Math.abs(dif),t);
    }else if(parts.size){
      const ex={amt:a,payer,parts:[...parts]};
      pv.textContent='Cada uno '+fmt(shares(ex)[0].v,t)+' · '+debtText(t,ex);
    }else pv.textContent='';
  };
  const paint=()=>{
    d.querySelector('#pw').innerHTML=t.people.map(p=>`<button class="chip ${payer===p.id?'on':''}" data-w="${p.id}">${esc(p.name)}</button>`).join('');
    d.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{payer=b.dataset.w;paint()});
    d.querySelector('#md').textContent=custom?'Montos distintos ⇄':'Partes iguales ⇄';
    const ch=d.querySelector('#ch');
    if(custom){
      ch.innerHTML=t.people.map(p=>`<div class="row" style="margin:4px 0"><span>${esc(p.name)}</span><input data-s="${p.id}" inputmode="decimal" placeholder="0,00" style="width:55%" value="${esc(cv[p.id]||'')}"></div>`).join('');
      ch.querySelectorAll('[data-s]').forEach(i=>i.oninput=()=>{cv[i.dataset.s]=i.value;preview()});
    }else{
      ch.innerHTML='<div class="chips">'+t.people.map(p=>`<button class="chip ${parts.has(p.id)?'on':''}" data-p="${p.id}">${esc(p.name)}</button>`).join('')+'</div>';
      ch.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{parts.has(b.dataset.p)?parts.delete(b.dataset.p):parts.add(b.dataset.p);paint()});
    }
    preview();
  };
  d.querySelector('#md').onclick=()=>{
    custom=!custom;
    if(custom){const a=amtNow();const sh=!isNaN(a)&&parts.size?shares({amt:a,payer,parts:[...parts]}):[];t.people.forEach(p=>{const s=sh.find(x=>x.p===p.id);cv[p.id]=s?c2s(s.v):''})}
    paint();
  };
  const paintCats=()=>{
    const ct=d.querySelector('#ct'),co=d.querySelector('#co');
    ct.innerHTML=tripCats(t).map(c=>`<button class="chip ${!otra&&cat===c?'on':''}" data-c="${esc(c)}">${catIcon(c)} ${esc(c)}</button>`).join('')+`<button class="chip ${otra?'on':''}" id="otra">📦 Otra…</button>`;
    ct.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=cat===b.dataset.c?'':b.dataset.c;catTouched=true;otra=false;paintCats()});
    ct.querySelector('#otra').onclick=()=>{otra=!otra;catTouched=true;paintCats();if(otra)co.focus()};
    co.style.display=otra?'block':'none';
  };
  d.querySelector('#d').oninput=()=>{if(!catTouched){cat=guessCat(d.querySelector('#d').value);paintCats()}};
  paintCats();
  d.querySelector('#a').oninput=preview;paint();
  if(!e)setTimeout(()=>d.querySelector('#a').focus(),50);
  d.querySelector('#x').onclick=close;
  if(e)d.querySelector('#del').onclick=()=>{
    if(!confirm(t.code?'¿Mandar este gasto a la papelera? Se puede restaurar.':'¿Borrar este gasto?'))return;
    t.expenses=t.expenses.filter(x=>x.id!==id);
    if(t.code){const x={...e,del:true};t.trash=[x,...(t.trash||[])];remoteSave(t,x,'del')}
    save();close();render();
  };
  d.querySelector('#ok').onclick=()=>{
    const amt=amtNow(),desc=d.querySelector('#d').value.trim();
    if(isNaN(amt))return alert('Monto inválido');
    if(amt>1e8)return alert('Monto demasiado grande');
    if(!desc)return alert('Falta el concepto');
    if(otra){
      const nc=d.querySelector('#co').value.trim();
      if(!nc)return alert('Escribí el nombre de la nueva categoría');
      cat=tripCats(t).find(c=>norm(c)===norm(nc))||nc;
    }
    const o={id:e?e.id:uid(),amt,desc,payer,date:e?e.date:Date.now()};
    if(cat)o.cat=cat;
    if(custom){
      const r=customVals();if(!r)return alert('Hay un monto inválido en el reparto');
      const sum=Object.values(r).reduce((x,y)=>x+y,0);
      if(sum!==amt)return alert(`Los montos del reparto suman ${fmt(sum,t)} y el gasto es ${fmt(amt,t)}`);
      o.split={};t.people.forEach(p=>{if(r[p.id]>0)o.split[p.id]=r[p.id]});
      o.parts=Object.keys(o.split);
    }else{
      if(!parts.size)return alert('Elegí al menos una persona');
      o.parts=t.people.filter(p=>parts.has(p.id)).map(p=>p.id);
    }
    if(e)t.expenses[t.expenses.indexOf(e)]=o;else t.expenses.push(o);
    S.lastPayer={...S.lastPayer,[t.id]:payer};
    t.code&&sync&&remoteSave(t,o);save();close();render();
  };
}

function menuDialog(){
  const t=trip(),m=mine(t);
  const d=open(`<h3 style="margin:0">${esc(t.name)}</h3><div style="display:grid;gap:8px;margin-top:12px">
  ${t.code?`<button id="tr">🗑️ Papelera (${(t.trash||[]).length})</button>
  <button id="me">👤 Este celular: ${m?esc(name(t,m))+' 🔒':'sin registrar'}</button>
  <button id="cd">☁️ Compartir código del viaje</button>`:''}
  <button id="x">Cerrar</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelector('#tr')&&(d.querySelector('#tr').onclick=()=>trashDialog(t));
  d.querySelector('#me')&&(d.querySelector('#me').onclick=()=>meDialog(t));
  d.querySelector('#cd')&&(d.querySelector('#cd').onclick=()=>codeDialog(t));
}
function meDialog(t){
  const m=mine(t);
  if(m){const d=open(`<h3 style="margin:0">👤 ${esc(name(t,m))} 🔒</h3><p>Este celular está registrado como <b>${esc(name(t,m))}</b>. No se puede cambiar, y nadie más puede registrarse como ${esc(name(t,m))}.</p><div class="acts"><button id="x">Cerrar</button></div>`);d.querySelector('#x').onclick=close;return}
  if(!sync||!srvClaims[t.code]){const d=open('<h3 style="margin:0">¿Quién sos?</h3><p>Necesitás conexión a internet para registrar este celular.</p><div class="acts"><button id="x">Cerrar</button></div>');d.querySelector('#x').onclick=close;return}
  const d=open(`<h3 style="margin:0">¿Quién sos?</h3>
  <p class="mu">Este celular queda registrado como esa persona <b>para siempre</b>: nadie más va a poder registrarse con ese nombre, y solo los celulares registrados pueden ver y cargar gastos.</p>
  <div class="chips">${t.people.map(p=>t.claims?.[p.id]?`<button class="chip" disabled style="opacity:.5">🔒 ${esc(p.name)}</button>`:`<button class="chip" data-m="${p.id}">${esc(p.name)}</button>`).join('')}</div>
  ${freePeople(t).length?'':'<p class="bad">Todas las personas ya están registradas en otros celulares.</p>'}
  <div class="acts"><button id="x">Cerrar</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const pid=b.dataset.m;
    if(!confirm(`¿Registrar este celular como ${name(t,pid)}? No se puede deshacer.`))return;
    claim(t,pid);close();render();
  });
}
function trashDialog(t){
  const tr=t.trash||[];
  const d=open(`<h3 style="margin:0">🗑️ Papelera</h3>
  <div style="max-height:55vh;overflow:auto;margin-top:8px">${tr.length?tr.map(e=>`<div class="card"><div class="row"><span class="b">${esc(e.desc)}</span><span class="b">${fmt(e.amt,t)}</span></div>
    <div class="row"><span class="mu">Borró ${esc(whoName(t,e.by))}${e.at?' · '+new Date(e.at).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''}</span><button data-r="${e.id}">Restaurar</button></div></div>`).join(''):'<div class="empty">Vacía</div>'}</div>
  <div class="acts"><button id="x">Cerrar</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const e=tr.find(x=>x.id===b.dataset.r);if(!e)return;
    const x={...e};delete x.del;
    t.trash=tr.filter(y=>y!==e);t.expenses.push(x);t.expenses.sort((a,b)=>a.date-b.date);
    remoteSave(t,x,'restore');save();close();render();
  });
}
async function historyDialog(t,e){
  if(!sync)return;
  const {db,fs}=sync,ACT={save:'Guardó',del:'Borró',restore:'Restauró',backup:'Respaldo inicial'};
  const d=open('<h3 style="margin:0">Historial</h3><div class="mu" style="margin-top:8px">Cargando…</div>');
  let hs;
  try{hs=(await fs.getDocs(fs.query(fs.collection(db,'trips',t.code,'history'),fs.where('exp','==',e.id)))).docs
    .map(x=>{const v=x.data({serverTimestamps:'estimate'});return {...v,at:v.at?.toMillis?.()??0}}).sort((a,b)=>b.at-a.at)}
  catch(err){console.warn(err);d.innerHTML='<p>No se pudo cargar el historial. Revisá la conexión.</p><div class="acts"><button id="x">Cerrar</button></div>';d.querySelector('#x').onclick=close;return}
  d.innerHTML=`<h3 style="margin:0">Historial</h3><div style="max-height:55vh;overflow:auto;margin-top:8px">${hs.map((h,i)=>{const v=h.data||{};const ok=validExp(t,{...v});
    return `<div class="card"><div class="mu">${ACT[h.act]||esc(h.act)} ${esc(whoName(t,h.by))} · ${h.at?new Date(h.at).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''}</div>
    <div class="row"><span>${esc(v.desc||'')}${v.del?' (borrado)':''}</span><span class="b">${ok?fmt(v.amt,t):'datos inválidos'}</span></div>
    ${ok?`<div class="mu">Pagó ${esc(name(t,v.payer))} · ${esc(debtText(t,v))}</div>`:''}
    ${i>0&&ok&&!v.del?`<div style="text-align:right;margin-top:6px"><button data-v="${i}">Restaurar esta versión</button></div>`:''}</div>`}).join('')||'<div class="empty">Sin historial</div>'}</div>
  <div class="acts"><button id="x">Cerrar</button></div>`;
  d.querySelector('#x').onclick=close;
  d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(!confirm('¿Volver a esta versión del gasto?'))return;
    const v=hs[+b.dataset.v].data,x={id:e.id,amt:v.amt,desc:v.desc,payer:v.payer,parts:v.parts,date:v.date};
    if(v.split)x.split=v.split;if(v.cat)x.cat=v.cat;
    t.expenses=t.expenses.filter(y=>y.id!==e.id).concat(x).sort((a,b)=>a.date-b.date);t.trash=(t.trash||[]).filter(y=>y.id!==e.id);
    remoteSave(t,x,'restore');save();close();render();
  });
}
function codeDialog(t){
  const link=location.origin+location.pathname+'#join='+t.code;
  const d=open(`<h3 style="margin:0">Compartir viaje</h3>
  <p class="mu">Con este código otro celular puede unirse, pero solo si queda alguna persona del viaje sin registrar.</p>
  <div class="card b" style="word-break:break-all;text-align:center">${showCode(t.code)}</div>
  <div class="acts"><button id="x">Cerrar</button><button class="p" id="sh">Compartir link</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelector('#sh').onclick=()=>{
    const txt='Unite a "'+t.name+'" para cargar gastos: '+link;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});
    else navigator.clipboard?.writeText(txt).then(()=>alert('Link copiado'));
  };
}
function joinDialog(pre=''){
  const d=open(`<h3 style="margin:0">Unirme a un viaje</h3>
  <label>Código o link</label><input id="c" value="${esc(pre)}" autocapitalize="off" autocomplete="off">
  <div class="acts"><button id="x">Cancelar</button><button class="p" id="ok">Unirme</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelector('#ok').onclick=()=>joinTrip(d.querySelector('#c').value);
}

function shareSummary(){
  const t=trip(),st=settle(t);
  const txt=`${t.name}\nTotal: ${fmt(t.expenses.reduce((a,e)=>a+e.amt,0),t)}\n`+(st.length?st.map(s=>`${name(t,s.from)} le debe ${fmt(s.v,t)} a ${name(t,s.to)}`).join('\n'):'Están a mano');
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard?.writeText(txt).then(()=>alert('Resumen copiado'));
}

if(S.trips.length)view=(S.trips.find(t=>t.id===S.last)||S.trips[S.trips.length-1]).id;
render();
initSync();
// Estado de conexión visible y app siempre actualizada: si vuelve a primer plano tras 30 min, recarga (los datos quedan guardados).
addEventListener('online',()=>{render();kick()});addEventListener('offline',render);
addEventListener('focus',kick);addEventListener('pageshow',kick);
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  kick();
  if(hiddenAt&&Date.now()-hiddenAt>30*60e3&&!$('#dlg').open&&navigator.onLine)location.reload();
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
